name: Docker CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Publish Docker image and binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish binaries
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            dest="publish/${rid}"
            dotnet publish src/Ratchet/Ratchet.csproj -c Release -r "$rid" -o "$dest" --verbosity minimal
            if [[ "$rid" == win-* ]]; then
              cp "$dest/Ratchet.exe" "artifacts/ratchet-${rid}.exe"
            else
              cp "$dest/Ratchet" "artifacts/ratchet-${rid}"
            fi
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: abeseler/ratchet
          tags: |
            type=semver,pattern={{version}}
  
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Ratchet/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
